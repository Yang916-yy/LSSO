name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-and-cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install package and test tools
        run: python -m pip install -e '.[experiments]' pytest build
      - name: Check repository hygiene
        run: python tools/check_repository_hygiene.py
      - name: Check Python sources
        run: python -m compileall -q lsso experiments benchmarks tools
      - name: Run portable operator tests
        run: >-
          pytest -q
          tests/smoke_test.py
          tests/length_normalization_test.py
          tests/mixer_adapter_test.py
          tests/rank_rotary_test.py
          tests/public_api_test.py
          tests/trace_normalization_test.py
          tests/deit3_rrlsso_adapter_test.py
          tests/deit3_official_recipe_test.py
          tests/imagenet_deit3_train_test.py
      - name: Build wheel and source distribution
        run: python -m build
