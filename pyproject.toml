[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsso-operator"
version = "0.2.0.dev0"
description = "Bidirectional low-rank Sylvester-solve token mixers for vision encoders."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Zhaoyang Wang", email = "zhaoy@uir.edu.cn" },
]
keywords = [
    "pytorch",
    "token-mixer",
    "sylvester",
    "efficient-transformer",
    "computer-vision",
    "vision-transformer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
]

[project.urls]
Repository = "https://github.com/Yang916-yy/LSSO"
Issues = "https://github.com/Yang916-yy/LSSO/issues"

[project.optional-dependencies]
experiments = [
    "matplotlib",
    "numpy",
    "tqdm",
    "torchvision",
    "timm>=1.0.27,<1.1",
    "webdataset>=1.0.2,<1.1",
    "huggingface-hub>=0.32",
]
openmmlab = [
    "mmengine>=0.10,<1",
    "mmdet>=3.3,<4",
    "mmsegmentation>=1.2,<2",
]
auxiliary = [
    "datasets>=3,<5",
    "transformers>=4.48,<6",
    "scipy>=1.11,<2",
    "sentencepiece>=0.2,<1",
]
all = [
    "matplotlib",
    "numpy",
    "tqdm",
    "torchvision",
    "timm>=1.0.27,<1.1",
    "webdataset>=1.0.2,<1.1",
    "huggingface-hub>=0.32",
    "mmengine>=0.10,<1",
    "mmdet>=3.3,<4",
    "mmsegmentation>=1.2,<2",
    "datasets>=3,<5",
    "transformers>=4.48,<6",
    "scipy>=1.11,<2",
    "sentencepiece>=0.2,<1",
]

[tool.setuptools.packages.find]
include = ["lsso*"]
exclude = ["data*", "runs*", "runs_archive*", "scripts*", "tests*", "notebooks*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
lsso = ["py.typed"]
