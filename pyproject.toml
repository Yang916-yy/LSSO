[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsso-operator"
version = "0.2.0"
description = "Bidirectional low-rank structured-solve token mixers for vision encoders."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Zhaoyang Wang", email = "zhaoy@uir.edu.cn" },
]
keywords = [
    "pytorch",
    "token-mixer",
    "structured-optimization",
    "efficient-transformer",
    "computer-vision",
    "vision-transformer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
]

[project.urls]
Repository = "https://github.com/Yang916-yy/LSSO"
Issues = "https://github.com/Yang916-yy/LSSO/issues"

[project.optional-dependencies]
experiments = [
    "matplotlib",
    "numpy",
    "tqdm",
    "torchvision",
    "timm>=1.0.27,<1.1",
    "huggingface-hub>=0.32",
    "webdataset>=0.2.111,<1",
]
auxiliary = [
    "datasets>=3,<5",
    "transformers>=4.48,<6",
    "scipy>=1.11,<2",
    "sentencepiece>=0.2,<1",
]
sequence = [
    "datasets>=3,<5",
    "huggingface-hub>=0.30",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "kagglehub>=0.4,<1",
    "scipy>=1.11,<2",
]
all = [
    "matplotlib",
    "numpy",
    "tqdm",
    "torchvision",
    "timm>=1.0.27,<1.1",
    "huggingface-hub>=0.32",
    "datasets>=3,<5",
    "transformers>=4.48,<6",
    "scipy>=1.11,<2",
    "sentencepiece>=0.2,<1",
    "Pillow>=10,<13",
    "kagglehub>=0.4,<1",
    "webdataset>=0.2.111,<1",
]

[tool.setuptools.packages.find]
include = ["lsso*"]
exclude = ["data*", "runs*", "runs_archive*", "scripts*", "tests*", "notebooks*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
lsso = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", "runs", "runs_archive"]
